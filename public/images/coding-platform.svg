<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><radialGradient id="g"><stop stop-color="#2b4057"/><stop offset="1" stop-color="#10151d"/></radialGradient></defs><rect width="1200" height="800" fill="url(#g)"/><g stroke="#86b5dc" opacity=".06"><path d="M0 160h1200M0 320h1200M0 480h1200M0 640h1200M200 0v800M400 0v800M600 0v800M800 0v800M1000 0v800"/></g><g transform="translate(110 120)" font-family="monospace"><rect width="980" height="560" rx="13" fill="#0d121a" stroke="#52657b"/><path d="M0 52h980M300 52v508M300 430h680" stroke="#293442"/><text x="24" y="32" fill="#adcae7" font-size="19">&lt;/&gt; forge</text><text x="500" y="31" fill="#71869c" font-size="10">WORKSPACE / DEMO CONCEPT</text><rect x="856" y="14" width="100" height="27" rx="4" fill="#afd5ed"/><text x="877" y="32" font-size="11" fill="#182430">▷ Run code</text><g transform="translate(24 90)"><text fill="#8cabc8" font-size="10">01 / THE CHALLENGE</text><text y="43" fill="#e0e9f3" font-size="21">Think in patterns.</text><text y="77" fill="#8796a8" font-size="11">Find the shortest path through</text><text y="96" fill="#8796a8" font-size="11">a connected network of nodes.</text><g fill="none" stroke="#729ec7" stroke-width="1.5"><path d="m48 180 84-35 86 70-104 45Zm84-35-18 115m-66-80 170 35"/><circle cx="48" cy="180" r="13" fill="#213448"/><circle cx="132" cy="145" r="13" fill="#213448"/><circle cx="218" cy="215" r="13" fill="#213448"/><circle cx="114" cy="260" r="13" fill="#739fc8"/></g><text y="331" fill="#c4d5e7" font-size="12">A little guidance, not the answer.</text><rect y="354" width="250" height="54" rx="5" fill="#1a2635"/><text x="16" y="386" fill="#9ebcda" font-size="11">✧ Reveal a thoughtful hint ↗</text></g><g transform="translate(328 90)" font-size="14"><text fill="#94a2b5">solution.ts <tspan x="230" fill="#465d76">TypeScript</tspan></text><g fill="#44546a" font-size="12"><text y="51">01</text><text y="81">02</text><text y="111">03</text><text y="141">04</text><text y="171">05</text><text y="201">06</text><text y="231">07</text><text y="261">08</text></g><g transform="translate(45 0)"><text y="51" fill="#b89acb">export function <tspan fill="#9fc9e6">findPath</tspan><tspan fill="#b6c8d8">(graph, start) {</tspan></text><text y="81" fill="#b6c8d8">  <tspan fill="#b89acb">const</tspan> visited = new Set();</text><text y="111" fill="#b6c8d8">  <tspan fill="#b89acb">const</tspan> queue = [[start]];</text><text y="141" fill="#566d84">  // Every good solution begins here.</text><text y="171" fill="#b89acb">  while <tspan fill="#b6c8d8">(queue.length) {</tspan></text><text y="201" fill="#b6c8d8">    <tspan fill="#b89acb">const</tspan> path = queue.shift();</text><text y="231" fill="#b6c8d8">    <tspan fill="#b89acb">const</tspan> node = path.at(-1);</text><text y="261" fill="#788da7">    ▌</text></g></g><text x="329" y="460" fill="#8ca3b9" font-size="10">CONSOLE / EXAMPLE OUTPUT</text><text x="329" y="498" fill="#a5d2bb" font-size="12">✓ Sample test case passed</text><text x="329" y="525" fill="#546e87" font-size="11">Ready for your next idea_</text></g><text x="600" y="745" fill="#7697b8" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="4">WRITE. REASON. REPEAT.</text></svg>
